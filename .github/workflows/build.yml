name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Create Flutter project and copy files
        run: |
          flutter create -t app tempapp
          cp -r android/app/src/main/kotlin tempapp/android/app/src/main/kotlin
          cp android/app/src/main/AndroidManifest.xml tempapp/android/app/src/main/AndroidManifest.xml
          cp android/AndroidManifest.xml tempapp/android/AndroidManifest.xml
          cp pubspec.yaml tempapp/pubspec.yaml
          cp -r lib/* tempapp/lib/
          cd tempapp
          flutter pub get || true
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: tempapp/build/app/outputs/flutter-apk/app-release.apk
